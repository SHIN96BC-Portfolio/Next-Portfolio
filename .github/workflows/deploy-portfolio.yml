# =============================================================================
# GitHub Actions 표현식 참조 정리 (이 워크플로에서 쓰는 것)
# =============================================================================
#
# ${{ ... }} 안에서 쓰는 컨텍스트 — "어디 값을 참조하는지"
#
# inputs.*
#   출처: Actions UI "Run workflow" 폼 (workflow_dispatch.inputs)
#   이 파일: on.workflow_dispatch.inputs 에 정의
#   사용 예:
#     inputs.target       → preview | production (배포 대상)
#     inputs.ref          → master 등 branch/tag/SHA
#     inputs.skip_checks  → true면 quality job 생략
#
# env.*
#   출처: 이 파일 상단 env 블록 (워크플로 전역 환경 변수)
#   사용 예:
#     env.PNPM_VERSION    → (삭제) package.json packageManager 사용
#     env.NODE_VERSION    → "22"
#     env.APP_DIR         → apps/user/portfolio
#   참고: step의 env 블록은 셸 환경 변수 — VERCEL_TOKEN 등은 secrets에서 주입
#
# secrets.*
#   출처: GitHub Repo → Settings → Secrets and variables → Actions
#   값은 워크플로 로그에 노출되지 않음
#   이 파일:
#     secrets.VERCEL_TOKEN        → Vercel Account Settings → Tokens
#     secrets.VERCEL_ORG_ID       → .vercel/project.json orgId
#     secrets.VERCEL_PROJECT_ID   → Vercel Project ID (prj_xxx)
#
# needs.*
#   출처: 같은 워크플로의 다른 job 실행 결과 (needs: 로 연결된 job)
#   이 파일: deploy job이 needs: quality 이므로
#     needs.quality.result → success | failure | skipped | cancelled
#
# always()
#   출처: GitHub Actions 내장 함수 (job/step 조건용)
#   의미: 선행 job이 실패해도 if 조건 평가를 계속함
#   이 파일: quality가 skipped( skip_checks )일 때도 deploy 실행 허용
#
# steps.*
#   출처: 같은 job 안에서 id가 붙은 step의 output
#   이 파일:
#     steps.deploy.outputs.url → Deploy step이 GITHUB_OUTPUT에 쓴 배포 URL
#
# github.*
#   출처: GitHub가 제공하는 저장소/워크플로 메타 (이 파일에서는 직접 미사용)
#   예: github.ref, github.repository, github.sha
#
# =============================================================================

# Portfolio 앱(@apps/user-portfolio)을 Vercel에 수동 배포합니다.
# Vercel Git 자동 배포는 vercel.json ignoreCommand로 비활성화하고, 이 워크플로만 사용합니다.
# 실행: GitHub → Actions → Deploy Portfolio (Vercel) → Run workflow
name: Deploy Portfolio (Vercel)

# push/trigger 자동 실행 없음 — Actions UI에서 수동 실행(workflow_dispatch)만 허용
on:
  workflow_dispatch:
    inputs:
      # preview: Vercel 프리뷰 URL (*.vercel.app)
      # production: --prod 배포 (커스텀 도메인 / Production 환경)
      target:
        description: 배포 대상
        required: true
        type: choice
        default: preview
        options:
          - preview
          - production
      # 배포할 커밋을 고정할 때 사용 (브랜치명, tag, commit SHA)
      ref:
        description: 배포할 Git ref (branch / tag / SHA)
        required: true
        type: string
        default: master
      # true면 quality job(lint/typecheck) 생략 — 긴급 배포용
      skip_checks:
        description: lint / typecheck 생략 (긴급 배포용)
        required: false
        type: boolean
        default: false

# 같은 target(preview/production)의 배포가 겹치면 대기 — 진행 중 배포는 취소하지 않음
concurrency:
  group: deploy-portfolio-${{ inputs.target }}
  cancel-in-progress: false

# 워크플로에 부여할 GitHub 권한 — checkout만 필요하므로 contents: read
permissions:
  contents: read

# 워크플로 전역 환경 변수 — Node 버전 및 앱 경로 (모노레포)
# pnpm 버전은 package.json packageManager 필드에서 자동으로 읽음
env:
  NODE_VERSION: "22"
  APP_DIR: apps/user/portfolio

jobs:
  # 1단계: 배포 전 품질 검사 (skip_checks=true면 스킵)
  quality:
    name: Lint & Typecheck
    if: ${{ inputs.skip_checks == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & typecheck portfolio app
        run: pnpm turbo run lint typecheck --filter=@apps/user-portfolio

  # 2단계: Vercel CLI로 배포
  # environment = GitHub Environments(preview / production) — production에 승인 규칙 걸 수 있음
  deploy:
    name: Deploy (${{ inputs.target }})
    needs: quality
    if: ${{ always() && (needs.quality.result == 'success' || needs.quality.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        id: deploy
        working-directory: ${{ env.APP_DIR }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail

          DEPLOY_ARGS=(--yes --token "$VERCEL_TOKEN")

          if [ "${{ inputs.target }}" = "production" ]; then
            DEPLOY_ARGS+=(--prod)
          fi

          url="$(vercel deploy "${DEPLOY_ARGS[@]}")"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Deployed to ${url}"

      - name: Summary
        run: |
          {
            echo "## Portfolio deployment"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Target | \`${{ inputs.target }}\` |"
            echo "| Ref | \`${{ inputs.ref }}\` |"
            echo "| URL | ${{ steps.deploy.outputs.url }} |"
          } >> "$GITHUB_STEP_SUMMARY"
