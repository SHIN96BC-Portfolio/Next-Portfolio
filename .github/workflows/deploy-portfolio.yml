# =============================================================================
# Portfolio (@apps/user-portfolio) — Vercel prebuilt 배포
# =============================================================================
#
# 실행: GitHub → Actions → Deploy Portfolio (Vercel) → Run workflow
#
# ## 흐름
#
#   quality:  lint & typecheck (pnpm install + turbo)
#   deploy:   vercel pull → vercel build → vercel deploy --prebuilt
#
#   - 빌드는 CI(GitHub Actions)에서 1번만 (vercel build)
#   - Vercel은 .vercel/output만 받아 호스팅 (원격 next build 없음)
#   - deploy job에는 별도 pnpm install 없음 (vercel.json installCommand가 처리)
#
# ## prebuilt 모노레포 필수 설정
#
#   Vercel 대시보드 (portfolio 프로젝트)
#     Root Directory: apps/user/portfolio
#     Git Integration: 연결하지 않음
#
#   이 워크플로 (deploy job)
#     vercel pull / build / deploy → 저장소 루트에서 실행
#     working-directory 로 앱 폴더 지정하지 않음
#
#   ✅ Root Directory = apps/user/portfolio  +  CLI = 저장소 루트
#   ❌ Root Directory 비움 + working-directory = apps/user/portfolio
#      → prebuilt 실패, Vercel 원격 빌드, "No Next.js version detected"
#   ❌ Root Directory + working-directory 둘 다 앱 폴더
#      → apps/user/portfolio/apps/user/portfolio 경로 중복
#
# ## Deployments 제목 (커밋 메시지)
#
#   Git 연동 없이 CLI만 쓰면 Vercel이 랜덤 배포 ID를 제목으로 씀.
#   deploy 스텝에서 --meta 로 Git 정보 전달:
#     githubDeployment=1, githubCommitMessage, githubCommitSha, githubCommitRef, ...
#
# ## Secrets (Repository → Settings → Secrets → Actions)
#
#   VERCEL_TOKEN
#   VERCEL_ORG_ID
#   VERCEL_PROJECT_ID_USER_PORTFOLIO
#
# ## vercel.json (apps/user/portfolio/)
#
#   installCommand / buildCommand — vercel build 시 cd ../.. 로 모노레포 루트에서 실행
#
# ## inputs (Run workflow)
#
#   target       preview | production
#   ref          배포할 branch / tag / SHA
#   skip_checks  true면 quality job 생략
#
# =============================================================================

name: Deploy Portfolio (Vercel)

# push/trigger 자동 실행 없음 — Actions UI에서 수동 실행(workflow_dispatch)만 허용
on:
  workflow_dispatch:
    inputs:
      # preview: Vercel 프리뷰 URL (*.vercel.app)
      # production: --prod 배포 (커스텀 도메인 / Production 환경)
      target:
        description: 배포 대상
        required: true
        type: choice
        default: preview
        options:
          - preview
          - production
      # 배포할 커밋을 고정할 때 사용 (브랜치명, tag, commit SHA)
      ref:
        description: 배포할 Git ref (branch / tag / SHA)
        required: true
        type: string
        default: master
      # true면 quality job(lint/typecheck) 생략 — 긴급 배포용
      skip_checks:
        description: lint / typecheck 생략 (긴급 배포용)
        required: false
        type: boolean
        default: false

# 같은 target(preview/production)의 배포가 겹치면 대기 — 진행 중 배포는 취소하지 않음
concurrency:
  group: deploy-portfolio-${{ inputs.target }}
  cancel-in-progress: false

# 워크플로에 부여할 GitHub 권한 — checkout만 필요하므로 contents: read
permissions:
  contents: read

# 워크플로 전역 환경 변수 — Node 버전 및 앱 경로 (모노레포)
# pnpm 버전은 package.json packageManager 필드에서 자동으로 읽음
env:
  NODE_VERSION: "22"
  APP_DIR: apps/user/portfolio
  # 모노레포: 앱마다 VERCEL_PROJECT_ID_<SLUG> secret 사용 (@apps/user-portfolio → USER_PORTFOLIO)
  VERCEL_PROJECT_ID_SECRET: VERCEL_PROJECT_ID_USER_PORTFOLIO

jobs:
  # 1단계: 배포 전 품질 검사 (skip_checks=true면 스킵)
  quality:
    name: Lint & Typecheck
    if: ${{ inputs.skip_checks == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & typecheck portfolio app
        run: pnpm turbo run lint typecheck --filter=@apps/user-portfolio

  # 2단계: prebuilt 배포 (CI에서 빌드, Vercel은 결과물만 호스팅)
  # environment = GitHub Environments(preview / production) — production에 승인 규칙 걸 수 있음
  deploy:
    name: Deploy (${{ inputs.target }})
    needs: quality
    if: ${{ always() && (needs.quality.result == 'success' || needs.quality.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Vercel CLI
        run: npm install -g vercel@58

      - name: Validate Vercel secrets
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_USER_PORTFOLIO }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          [[ -z "${VERCEL_TOKEN:-}" ]] && missing+=(VERCEL_TOKEN)
          [[ -z "${VERCEL_ORG_ID:-}" ]] && missing+=(VERCEL_ORG_ID)
          [[ -z "${VERCEL_PROJECT_ID:-}" ]] && missing+=(${{ env.VERCEL_PROJECT_ID_SECRET }})
          if ((${#missing[@]} > 0)); then
            echo "::error::GitHub Secrets 미등록: ${missing[*]}"
            echo ""
            echo "Vercel 프로젝트가 아직 없다면 Actions 실행 전 로컬에서 생성:"
            echo "  ./scripts/vercel/setup-project.sh user-portfolio apps/user/portfolio"
            echo ""
            echo "공통: VERCEL_TOKEN, VERCEL_ORG_ID"
            echo "앱별: ${{ env.VERCEL_PROJECT_ID_SECRET }}"
            exit 1
          fi

      - name: Pull Vercel environment
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_USER_PORTFOLIO }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          ENV_NAME=preview
          if [ "${{ inputs.target }}" = "production" ]; then
            ENV_NAME=production
          fi
          vercel pull --yes --environment="$ENV_NAME" --token="$VERCEL_TOKEN"

      - name: Build (prebuilt)
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_USER_PORTFOLIO }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          BUILD_ARGS=()
          if [ "${{ inputs.target }}" = "production" ]; then
            BUILD_ARGS+=(--prod)
          fi
          vercel build "${BUILD_ARGS[@]}" --token="$VERCEL_TOKEN"
          if [ ! -d .vercel/output ]; then
            echo "::error::.vercel/output not found — vercel build did not produce prebuilt artifacts"
            exit 1
          fi

      - name: Deploy prebuilt to Vercel
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_USER_PORTFOLIO }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail

          COMMIT_SHA_SHORT="$(git rev-parse --short HEAD)"
          COMMIT_MSG="$(git log -1 --pretty=%s | head -c 200 | tr -d '"')"
          COMMIT_AUTHOR="$(git log -1 --pretty=%an)"

          DEPLOY_ARGS=(
            --prebuilt
            --yes
            --token "$VERCEL_TOKEN"
            -m "githubDeployment=1"
            -m "githubCommitSha=${COMMIT_SHA_SHORT}"
            -m "githubCommitMessage=${COMMIT_MSG}"
            -m "githubCommitRef=${{ inputs.ref }}"
            -m "githubCommitOrg=${{ github.repository_owner }}"
            -m "githubRepo=${{ github.event.repository.name }}"
            -m "githubOrg=${{ github.repository_owner }}"
            -m "githubCommitAuthorName=${COMMIT_AUTHOR}"
            -m "githubCommitAuthorLogin=${{ github.actor }}"
          )

          if [ "${{ inputs.target }}" = "production" ]; then
            DEPLOY_ARGS+=(--prod)
          fi

          url="$(vercel deploy "${DEPLOY_ARGS[@]}")"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Deployed to ${url}"

      - name: Summary
        run: |
          {
            echo "## Portfolio deployment"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Target | \`${{ inputs.target }}\` |"
            echo "| Ref | \`${{ inputs.ref }}\` |"
            echo "| URL | ${{ steps.deploy.outputs.url }} |"
          } >> "$GITHUB_STEP_SUMMARY"
